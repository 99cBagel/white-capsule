# Deploy the snail-eyes Worker (Snail Eyes site + KB MCP service)
# to Cloudflare on push to main.
#
# The worker checks in wrangler.toml (complete as-is): no template
# rendering, no build step, no npm scripts. The deploy runs
# `npx wrangler deploy` with the repo secrets.
#
# Requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets,
# set in the repo's Settings > Secrets and variables.
#
# Safety: this deploys exactly what is on main. The worker code
# (src/index.js) and bindings (R2, AI) are unchanged by this workflow;
# only committed files reach production.
name: Deploy to Cloudflare
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: false
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Deploy Worker
        run: npx wrangler deploy
